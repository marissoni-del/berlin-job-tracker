name: Berlin Job Tracker – Daily Search

on:
  schedule:
    # Roda todos os dias às 08:00 UTC (09:00 Berlin horário de verão)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Permite rodar manualmente pelo botão no GitHub

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4 feedparser

      - name: Executar scraper
        run: python scraper.py

      - name: Gerar dashboard HTML
        run: python generate_html.py

      - name: Commitar resultados atualizados
        run: |
          git config --global user.name "Job Tracker Bot"
          git config --global user.email "bot@jobtracker.local"
          git add jobs_data.json dashboard.html
          git diff --staged --quiet || git commit -m "🔄 Atualização diária – $(date +'%d/%m/%Y')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
