name: Berlin Job Tracker – Daily Search

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  search-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser

      - name: Run scraper
        run: python scraper.py

      - name: Generate dashboard
        run: python generate_html.py

      - name: Commit results
        run: |
          git config --global user.name "Job Tracker Bot"
          git config --global user.email "bot@jobtracker.local"
          git add jobs_data.json dashboard.html
          git diff --staged --quiet || git commit -m "Daily update $(date +'%d/%m/%Y')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
